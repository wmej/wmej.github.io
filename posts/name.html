    </header>

    <div class="post-body">
      <p>有人问过 Wmej 怎么念。</p>
      <p>它是我名字四个字的首字母，每个字取开头，拼起来就是 Wmej。</p>
      <p>念起来刚好是「我没耳机」。W 是我，M 是没，E 是耳，J 是机。第一次见的人常把它当成某个英文单词，其实它是我名字的缩写，还顺便凑成了一句大实话。</p>
      <p>用久了有个奇怪的感觉。四个汉字拆成四个字母，念得多了，好像真的长成了另外一个人。不过这个人也是我。</p>
      <p>所以我没打算换。</p>
    </div>
